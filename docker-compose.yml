# Production-style deployment: FastAPI app (multi-worker) + PostgreSQL.
#
#   cp .env.example .env      # then set JWT_SECRET / POSTGRES_PASSWORD
#   docker compose up --build
#
# The app auto-creates its tables on startup and imports any legacy JSON
# tenant data mounted at /app/data on first access.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kol_saas
      POSTGRES_USER: kol
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kol -d kol_saas"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://kol:${POSTGRES_PASSWORD}@db:5432/kol_saas
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
    ports:
      - "8000:8000"

volumes:
  pgdata:
