# Production deployment: FastAPI app (multi-worker) + PostgreSQL, with an
# optional Caddy reverse proxy that obtains HTTPS certificates automatically.
#
#   cp .env.example .env          # set JWT_SECRET / POSTGRES_PASSWORD / ADMIN_KEY
#   docker compose up -d --build                    # app on 127.0.0.1:8000
#   docker compose --profile https up -d --build    # + HTTPS on your DOMAIN
#
# Full walkthrough (backups, upgrades, checklist): docs/DEPLOYMENT.md
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kol_saas
      POSTGRES_USER: kol
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kol -d kol_saas"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://kol:${POSTGRES_PASSWORD}@db:5432/kol_saas
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ADMIN_KEY: ${ADMIN_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      AGENT_BASE_URL: ${AGENT_BASE_URL:-https://api.deepseek.com}
      AGENT_MODEL: ${AGENT_MODEL:-deepseek-chat}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-}
      APP_BASE_URL: ${APP_BASE_URL:-}
      PAY_PAYEE_NAME: ${PAY_PAYEE_NAME:-}
      PAY_CURRENCY: ${PAY_CURRENCY:-MYR}
      PAY_FX_RATE: ${PAY_FX_RATE:-4.4}
      OPERATOR_EMAIL: ${OPERATOR_EMAIL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Trust X-Forwarded-For from the proxy on the compose network, so rate
      # limits see the real client IP rather than the proxy's.
      FORWARDED_ALLOW_IPS: "*"
    # Loopback only: the app speaks plain HTTP, so it must sit behind a TLS
    # proxy (the caddy service below, or your own nginx / cloud load balancer).
    ports:
      - "127.0.0.1:8000:8000"

  caddy:
    profiles: ["https"]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env to use the https profile}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
